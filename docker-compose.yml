version: "3"

services:
  zone-dyndns:
    build:
      context: .
    restart: always
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      USERNAME: ${USERNAME}
      PASSWORD: ${PASSWORD}
      NETWORK_RETRY_DELAY: ${NETWORK_RETRY_DELAY}
      CHECK_FREQUENCY: ${CHECK_FREQUENCY}
      TZ: ${TZ}
    volumes:
      - ./logs:/zone-dyndns/logs/
      - ./conf:/zone-dyndns/conf/
